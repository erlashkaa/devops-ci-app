---
- name: Pull immutable application image
  ansible.builtin.command: "docker pull {{ app_image }}"
  register: image_pull
  changed_when: "'Downloaded newer image' in image_pull.stdout"
- name: Run application container
  ansible.builtin.shell: |
    set -e
    current="$(docker inspect -f '{{ '{{' }}.Config.Image{{ '}}' }}' {{ app_container }} 2>/dev/null || true)"
    running="$(docker inspect -f '{{ '{{' }}.State.Running{{ '}}' }}' {{ app_container }} 2>/dev/null || true)"
    if [ "$current" != "{{ app_image }}" ] || [ "$running" != "true" ]; then
      docker rm -f {{ app_container }} >/dev/null 2>&1 || true
      docker run -d --name {{ app_container }} --restart unless-stopped \
        -p {{ app_bind }}:{{ app_port }}:5000 {{ app_image }}
      echo changed
    fi
  args:
    executable: /bin/bash
  register: container_run
  changed_when: "'changed' in container_run.stdout"
