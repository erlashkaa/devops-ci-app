name: CI and container publication

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pylint app tests

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/devops-ci-app
    steps:
      - uses: actions/checkout@v4
      - name: Normalize image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - name: Build image
        run: docker build -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .
      - name: Verify running container
        run: |
          docker run -d --name devops-ci-app -p 127.0.0.1:5000:5000 "$IMAGE:${GITHUB_SHA}"
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5000/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs devops-ci-app
          exit 1
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish reviewed image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
    runs-on: [self-hosted, devops-vm]
    permissions:
      contents: read
    concurrency:
      group: deploy-devops-vm
      cancel-in-progress: false
    env:
      VM_HOST: 192.168.56.10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Deploy immutable image with Ansible
        working-directory: ansible
        run: >-
          ~/.local/bin/ansible-playbook site.yml
          -e "app_image=ghcr.io/erlashkaa/devops-ci-app:${GITHUB_SHA}"
      - name: Verify service through Nginx
        run: >-
          curl --fail --silent --show-error
          "http://${VM_HOST}/health" | grep -q '"status":"ok"'

